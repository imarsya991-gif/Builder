name: Build ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: namespace-profile-cedro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check disk and install deps
        run: |
          df -h
          free -h
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
          # Install repo tool
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init repo and sync
        run: |
          mkdir -p ~/rom
          cd ~/rom
          
          git config --global user.name "imarsya991-gif"
          git config --global user.email "imarsya991-gif@users.noreply.github.com"
          
          repo init -u https://github.com/crdroidandroid/android.git -b 12.1 --git-lfs --no-clone-bundle
          
          # --- SETUP LOCAL MANIFEST (DT, KT, VENDOR) ---
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/local.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Device Tree -->
            <project name="imarsya991-gif/device_xiaomi_lavender" path="device/xiaomi/lavender" remote="github" revision="12.1" />
            <!-- Kernel Tree -->
            <project name="imarsya991-gif/android_kernel_xiaomi_sdm660_southwest-ng" path="kernel/xiaomi/sdm660" remote="github" revision="main" />
            <!-- Vendor Tree -->
            <project name="imarsya991-gif/vendor_xiaomi_lavender" path="vendor/xiaomi/lavender" remote="github" revision="12.1" />
          </manifest>
          EOF
          # ---------------------------------------------

          # Sync (Gunakan -j4 atau -j8 agar RAM tidak OOM)
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Build ROM
        run: |
          cd ~/rom
          
          # Setup CCACHE agar build lebih cepat di masa depan
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=~/.ccache
          ccache -M 50G
          
          # Source dan Breakfast
          source build/envsetup.sh
          breakfast lavender userdebug
          
          # Mulai Build
          m bacon -j$(nproc --all)
